# Servicios de desarrollo. Las etiquetas van fijas (versión exacta y sistema
# base) para que todos levanten exactamente la misma base de datos.
services:
  db:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    container_name: leggal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - leggal_pgdata:/var/lib/postgresql/data
    # "sano" solo cuando acepta conexiones; así nadie migra contra una base
    # que todavía está arrancando.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4.12-bookworm
    container_name: leggal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - leggal_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  leggal_pgdata:
  leggal_redisdata:
