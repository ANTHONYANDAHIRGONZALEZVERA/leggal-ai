services:
  db:
    image: pgvector/pgvector:pg16
    container_name: leggal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - leggal_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: leggal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - leggal_redisdata:/data

volumes:
  leggal_pgdata:
  leggal_redisdata: