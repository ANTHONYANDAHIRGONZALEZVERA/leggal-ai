name: backend

# Corre siempre (no se filtra por carpeta aquí): si el check no corre,
# GitHub lo deja "pendiente" y bloquea la fusión. El filtro va adentro.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Revisar si cambió backend/
        uses: dorny/paths-filter@v3
        id: cambios
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend.yml'

      - name: Sin cambios en backend
        if: steps.cambios.outputs.backend != 'true'
        run: echo "No hay cambios en backend/; el check pasa sin correr pasos."

      - uses: actions/setup-node@v4
        if: steps.cambios.outputs.backend == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        if: steps.cambios.outputs.backend == 'true'
        working-directory: backend
        run: npm ci

      # Plantilla del día 1. En B14 se agregan PostgreSQL con pgvector como
      # servicio, migraciones, lint, compilación, pruebas unitarias y e2e.
