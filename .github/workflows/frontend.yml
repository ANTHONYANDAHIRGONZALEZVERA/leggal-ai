name: frontend

# Corre siempre (no se filtra por carpeta aquí): si el check no corre,
# GitHub lo deja "pendiente" y bloquea la fusión. El filtro va adentro.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar si cambió frontend/
        uses: dorny/paths-filter@v3
        id: cambios
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend.yml'

      - name: Sin cambios en frontend
        if: steps.cambios.outputs.frontend != 'true'
        run: echo "No hay cambios en frontend/; el check pasa sin correr pasos."

      - uses: actions/setup-node@v4
        if: steps.cambios.outputs.frontend == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        if: steps.cambios.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci

      # Plantilla del día 1. En F13 se agregan lint, "tsc --noEmit" y Jest
      # (hoy tsc falla en un archivo de la plantilla de Expo que F03 elimina).
