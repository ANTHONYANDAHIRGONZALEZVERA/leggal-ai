name: frontend

# Corre siempre (no se filtra por carpeta aquí): si el check no corre,
# GitHub lo deja "pendiente" y bloquea la fusión. El filtro va adentro.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Revisar si cambió frontend/
        uses: dorny/paths-filter@v3
        id: cambios
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend.yml'

      - name: Sin cambios en frontend
        if: steps.cambios.outputs.frontend != 'true'
        run: echo "No hay cambios en frontend/; el check pasa sin correr pasos."

      - uses: actions/setup-node@v4
        if: steps.cambios.outputs.frontend == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        if: steps.cambios.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci

      # Revisiones de F13. Las ramas anteriores a F13 aún no tienen ESLint
      # configurado ni los scripts "tipos" y "test": se saltan esos pasos en
      # vez de fallar ("--if-present" y la condición de eslint.config.js).
      - name: Revisar estilo y errores comunes (ESLint)
        if: steps.cambios.outputs.frontend == 'true' && hashFiles('frontend/eslint.config.js') != ''
        working-directory: frontend
        run: npm run lint

      - name: Revisar tipos (TypeScript)
        if: steps.cambios.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run tipos --if-present

      - name: Correr pruebas (Jest)
        if: steps.cambios.outputs.frontend == 'true'
        working-directory: frontend
        run: npm test --if-present -- --ci
